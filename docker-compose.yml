version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sbnsentinel_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sbnsentinel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: sbnsentinel_backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/sbnsentinel
      - SECRET_KEY=your_production_secret_key_change_me
      - CORS_ORIGINS=http://143.198.65.226
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: sbnsentinel_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://143.198.65.226:8000
    ports:
      - "80:3000"

volumes:
  postgres_data:
