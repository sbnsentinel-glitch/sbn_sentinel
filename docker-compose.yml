version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sbnsentinel_db
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: sbnsentinel_backend
    restart: always
    depends_on:
      - db
    env_file:
      - ./backend/.env
    # Removed ports, Caddy handles routing

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_BACKEND_URL=https://api.sbnsentinel.com
    container_name: sbnsentinel_frontend
    restart: always
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    # Removed ports, Caddy handles routing

  caddy:
    image: caddy:2-alpine
    container_name: sbnsentinel_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
